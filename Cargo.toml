[package]
name = "tsuiku"
version = "0.1.0"
edition = "2024"
description = "A TUI diff viewer that overlays difftastic's structural diffs on line diffs"
repository = "https://github.com/kokatsu/tsuiku"
license = "MIT OR Apache-2.0"
keywords = ["diff", "git", "tui", "difftastic"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
blake3 = "1.8.5"
crossterm = "0.29.0"
gix = { version = "0.86", default-features = false, features = [
    "status",
    "index",
    "dirwalk",
    "revision",
    "blob-diff",
    "max-performance-safe",
    "sha1",
] }
imara-diff = "0.2.0"
libc = "0.2.189"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.1.1"
syntect = "5.3.0"
tempfile = "3.27.0"
two-face = "0.5.1"
unicode-width = "0.2.2"

[dev-dependencies]
tree-sitter = "0.26.11"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.26.11"
tree-sitter-javascript = "0.25.0"
tree-sitter-md = "0.5.3"
tree-sitter-nix = "0.3.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
